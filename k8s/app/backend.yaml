apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: internship
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: internship-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: internship-platform

    spec:
      serviceAccountName: internship-app
      terminationGracePeriodSeconds: 30

      containers:
        - name: backend
          image: internship-api:local
          imagePullPolicy: IfNotPresent

          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: internship-config

            - secretRef:
                name: internship-secrets

          env:
            - name: OTEL_SERVICE_NAME
              value: internship-api

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 45
            periodSeconds: 2
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: internship

  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: internship-platform

spec:
  selector:
    app: backend

  ports:
    - name: http
      port: 8000
      targetPort: http
