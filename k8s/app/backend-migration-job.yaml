apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: internship

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: backend-migrate

    spec:
      serviceAccountName: internship-app
      restartPolicy: Never

      containers:
        - name: migrate
          image: internship-api:local
          imagePullPolicy: IfNotPresent

          command:
            - alembic
            - upgrade
            - head

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: internship-secrets
                  key: DATABASE_URL
