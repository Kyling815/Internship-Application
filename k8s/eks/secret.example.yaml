apiVersion: v1
kind: Secret
metadata:
  name: internship-secrets
  namespace: internship
type: Opaque
stringData:
  SECRET_KEY: replace-with-production-secret
  DATABASE_URL: postgresql+psycopg2://user:password@rds-private-endpoint:5432/internship_tracker
  REDIS_URL: rediss://default:password@elasticache-primary-endpoint:6379
  S3_BUCKET: internship-app-uploads
  S3_PUBLIC_BASE_URL: https://assets.example.com

