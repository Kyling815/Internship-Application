controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"

        namespaces {
          names = ["internship"]
        }
      }

      discovery.relabel "application_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex = "backend|chat-service|postgres|redis|dynamodb-local"
          action = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }

        rule {
          target_label = "environment"
          replacement = "local-kubernetes"
        }

        rule {
          target_label = "platform"
          replacement = "internship-platform"
        }
      }

      loki.source.kubernetes "application_pods" {
        targets = discovery.relabel.application_pods.output
        forward_to = [loki.process.application_pods.receiver]
      }

      loki.process "application_pods" {
        stage.cri {}
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

