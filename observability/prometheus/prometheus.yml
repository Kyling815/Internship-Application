global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          environment: local
          service: internship-api

  - job_name: chat-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - chat-service:3000
        labels:
          environment: local
          service: chat-service